name: Build Windows GUI EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "m2_extract_phys.py"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Check source syntax
        run: python -m py_compile m2_extract_phys.py

      - name: Build single-file GUI executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name WoWPhysExtractor
          m2_extract_phys.py

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/WoWPhysExtractor.exe")) {
            throw "EXE build output was not found."
          }
          Get-Item "dist/WoWPhysExtractor.exe" | Select-Object Name, Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WoWPhysExtractor-Windows-x64
          path: dist/WoWPhysExtractor.exe
          if-no-files-found: error
          retention-days: 14
